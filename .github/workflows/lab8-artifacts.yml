name: Lab 8 artifacts

on:
  push:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install profiling and semantic dependencies
        run: uv sync --group profiling --extra semantic

      - name: cProfile index
        run: |
          uv run python -m cProfile -o docs/index_baseline.prof -m findex.cli index web/demo_docs.jsonl --workers 1 --executor serial -o /tmp/index_profiled.json

      - name: cProfile search
        run: |
          uv run python -m cProfile -o docs/search_baseline.prof -m findex.cli search web/demo_index.json "the event loop" --k 10 --scorer bm25 --json > /tmp/search_cprofile.txt
          cat /tmp/search_cprofile.txt

      - name: py-spy index flame graph
        run: |
          uv run --group profiling py-spy record --format flamegraph --output docs/index_flame.svg -- python -m findex.cli index web/demo_docs.jsonl --workers 1 --executor serial -o /tmp/index_pyspy.json

      - name: py-spy search flame graph
        run: |
          uv run --group profiling py-spy record --format flamegraph --output docs/search_flame.svg -- python -m findex.cli search web/demo_index.json "the event loop" --k 10 --scorer bm25 --json

      - name: Scalene index
        run: |
          uv run --group profiling scalene --json --outfile docs/index_scalene.json -- python -m findex.cli index web/demo_docs.jsonl --workers 1 --executor serial -o /tmp/index_scalene.json

      - name: Scalene search
        run: |
          uv run --group profiling scalene --json --outfile docs/search_scalene.json -- python -m findex.cli search web/demo_index.json "the event loop" --k 10 --scorer bm25 --json

      - name: Semantic Precision@5
        run: |
          uv run python scripts/eval_semantic.py | tee docs/semantic_eval.txt

      - name: Profile summary
        run: |
          uv run python - <<'PY'
          import pstats
          from pathlib import Path

          def emit(path: str, title: str) -> list[str]:
              lines = [f"## {title}"]
              stats = pstats.Stats(path)
              rows = sorted(
                  stats.stats.items(),
                  key=lambda item: item[1][3],
                  reverse=True,
              )[:12]
              for (filename, lineno, func), (_, _, tt, ct, _) in rows:
                  lines.append(
                      f"- {filename}:{lineno} {func} — "
                      f"tottime={tt:.3f}s, cumulative={ct:.3f}s"
                  )
              return lines

          text = [
              "# Lab 8 profiling summary",
              "",
              "The CI-generated flame graphs use the repository demo corpus "
              "(web/demo_docs.jsonl / web/demo_index.json). "
              "The full 200-document local baseline measurements are recorded "
              "in the Lab 8 README/report.",
              "",
          ]
          text += emit("docs/index_baseline.prof", "cProfile: index")
          text += [""] + emit("docs/search_baseline.prof", "cProfile: search")
          Path("docs/profile_summary.md").write_text(
              "\n".join(text) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/eval_semantic.py
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
            exit 0
          fi
          git commit -m "Generate Lab 8 profiling and semantic artifacts"
          git push
