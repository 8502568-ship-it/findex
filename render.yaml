services:
  - type: web
    name: findex
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: FINDEX_INDEX_PATH
        value: /app/web/demo_index.json
      - key: FINDEX_DOCS_PATH
        value: /app/web/demo_docs.jsonl
      - key: FINDEX_SEMANTIC_EMBEDDINGS_PATH
        value: /app/web/demo_embeddings.npy
      - key: FINDEX_SEMANTIC_METADATA_PATH
        value: /app/web/demo_embeddings.json
